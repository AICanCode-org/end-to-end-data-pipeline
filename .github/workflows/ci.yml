# Starter CI: lint + tests for the shared package and both tracks on every push and pull request.
# Pending tests are skipped, so this is green on day one. In Phase 5 you replace this file with the full pipeline
# (path filters, the contract and CMS checks, the DAG tests, parity of both tracks on the full data, ci-ok).
# Every concept used here is explained in docs/github-actions-explained.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.part }} · lint + unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [pipewright, sql, pyspark]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipewright/requirements*.txt
            tracks/*/requirements*.txt
      - if: matrix.part == 'pyspark'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install
        run: make install-${{ matrix.part }} PY=python
      - name: Lint
        run: make lint-${{ matrix.part }} PY=python
      - name: Tests
        run: make test-${{ matrix.part }} PY=python
