[project]
name = "pipewright"
version = "1.0.0"
description = "Pipewright: the shared pipeline code (ingestion, runner, data-quality checks, AI incident explainer)"
requires-python = ">=3.11"
dependencies = ["duckdb==1.5.6", "pyyaml==6.0.3"]

[project.scripts]
pipewright = "pipewright.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipewright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pipewright"]
branch = true
omit = ["*/__main__.py", "*/testkit.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
